# One-time job: copies images from the old WordPress site into this repository.
# Runs only when started by hand or when this file changes. Delete it after the move.
name: Copy images from old site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/copy-images.yml]
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-images.mjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/work
          git diff --cached --quiet || git commit -m "Copy images from the old WordPress site"
          git push
